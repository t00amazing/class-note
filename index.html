<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>질문이 쌓이는 기록장 · 인체구조와 기능</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#FCF3D9;
    --paper:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#7A7364;
    --accent:#F6C445;
    --accent-dark:#E7AE1E;
    --accent-ink:#1A1A1A;
    --sky:#CDEAF7;
    --sky-ink:#1F5C77;
    --sky-soft:#E7F4FB;
    --pink:#FBDCE6;
    --pink-ink:#9C3F62;
    --line:rgba(26,26,26,.85);
    --radius:22px;
    --thin:1.5px;
    --shadow-thin:0 2px 6px rgba(26,26,26,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(circle at 100% 0%, rgba(205,234,247,.45), transparent 45%);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 18px 80px;}

  /* ===== 상단 알약형 내비게이션 ===== */
  .navbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);
    border:var(--thin) solid var(--ink);
    border-radius:999px;
    padding:10px 10px 10px 20px;
    box-shadow:var(--shadow-thin);
    margin-bottom:30px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;}
  .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;border:var(--thin) solid var(--ink);}
  .nav-admin-btn{
    background:var(--sky);color:var(--sky-ink);border:var(--thin) solid var(--ink);border-radius:999px;
    padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-thin);
  }

  header.top{
    position:relative;
    display:flex;flex-direction:column;gap:2px;margin-bottom:22px;
    padding:4px 4px 6px;
  }
  .doodle{position:absolute;font-size:20px;color:var(--sky-ink);}
  .doodle-1{top:-6px;left:-2px;transform:rotate(-8deg);}
  .eyebrow{
    font-size:12px;letter-spacing:.12em;color:var(--sky-ink);font-weight:800;
    text-transform:uppercase;margin-left:22px;
  }
  h1{
    font-size:28px;line-height:1.22;margin:6px 0 0;font-weight:800;color:var(--ink);
    letter-spacing:-.02em;
  }
  .sub{font-size:13.5px;color:var(--ink-soft);margin-top:8px;font-weight:600;}

  .card{
    background:var(--paper);
    border:var(--thin) solid var(--ink);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:var(--shadow-thin);
  }
  label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  select, textarea, input[type=text], input[type=password], input[type=date]{
    width:100%;
    font-family:inherit;
    font-size:16px;
    padding:12px 14px;
    border:var(--thin) solid var(--ink);
    border-radius:14px;
    background:#FFFDF6;
    color:var(--ink);
    margin-bottom:14px;
  }
  select:focus, textarea:focus, input:focus{
    outline:none;
    border-color:var(--sky-ink);
  }
  textarea{min-height:88px;resize:vertical;line-height:1.5;}

  button{
    font-family:inherit;
    cursor:pointer;
    border:var(--thin) solid var(--ink);
    border-radius:999px;
    font-weight:800;
    font-size:15px;
    padding:14px 20px;
    transition:transform .12s ease;
    box-shadow:var(--shadow-thin);
  }
  button:active{transform:scale(.98);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;}
  .btn-primary:hover{background:#F8CE60;}
  .btn-primary:disabled{background:#EDE3C0;color:#B3AA8F;box-shadow:none;border-color:var(--line);cursor:not-allowed;}
  .btn-ghost{background:#fff;color:var(--ink);}
  .btn-ghost:hover{background:var(--sky-soft);}
  .btn-row{display:flex;gap:10px;}
  .btn-row button{flex:1;}
  .btn-small{padding:8px 14px;font-size:13px;}
  .btn-danger{background:var(--pink);color:var(--pink-ink);}

  .link-admin{ display:none; }

  /* 회차 트래커 - 서명 요소: 살짝 기울어진 스티커 배지 5개 */
  .track{display:flex;gap:6px;margin-bottom:18px;}
  .track .tag{
    flex:1;text-align:center;padding:10px 2px;border-radius:16px;
    border:var(--thin) solid var(--ink);font-size:12px;color:var(--ink-soft);
    font-weight:800;background:#FFFDF6;
    transform:rotate(-1.5deg);
    box-shadow:var(--shadow-thin);
  }
  .track .tag:nth-child(even){transform:rotate(1.5deg);}
  .track .tag .num{
    font-size:19px;display:block;color:var(--ink);font-weight:800;
  }
  .track .tag.done{background:var(--sky);color:var(--sky-ink);}
  .track .tag.done .num{color:var(--sky-ink);}
  .track .tag.current{border-color:var(--accent-dark);box-shadow:0 0 0 2px rgba(231,174,30,.2);}

  .chip-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .chip{
    background:var(--sky);color:var(--sky-ink);border:var(--thin) solid var(--ink);border-radius:999px;
    padding:6px 13px;font-size:12.5px;font-weight:700;
  }

  .rec-card{border:var(--thin) solid var(--ink);border-radius:18px;padding:16px 18px;margin-bottom:10px;background:#FFFDF6;box-shadow:var(--shadow-thin);}
  .rec-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .rec-card .head .badge{
    font-size:13px;font-weight:800;background:var(--sky);color:var(--sky-ink);
    padding:4px 12px;border-radius:999px;border:var(--thin) solid var(--ink);
  }
  .rec-card .empty-badge{background:#F5EFD8;color:var(--ink-soft);}
  .rec-card .meta{font-size:11.5px;color:#B3AA8F;font-weight:700;}
  .rec-card .field-label{font-size:12px;color:var(--ink-soft);font-weight:800;margin-top:10px;}
  .rec-card .field-val{font-size:14px;line-height:1.55;margin-top:3px;white-space:pre-wrap;}

  .empty-note{font-size:13px;color:var(--ink-soft);text-align:center;padding:18px 0;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.admin-table th, table.admin-table td{
    text-align:left;padding:9px 6px;border-bottom:1px solid rgba(26,26,26,.12);
  }
  table.admin-table th{color:var(--ink-soft);font-weight:800;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tabs button{flex:1;background:#FFFDF6;color:var(--ink-soft);font-size:13px;padding:11px 10px;}
  .tabs button.active{background:var(--ink);color:#fff;}

  .msg{font-size:13px;padding:11px 14px;border-radius:14px;margin-bottom:12px;font-weight:700;border:var(--thin) solid var(--ink);}
  .msg.ok{background:var(--sky-soft);color:var(--sky-ink);}
  .msg.err{background:var(--pink);color:var(--pink-ink);}

  .row-inline{display:flex;gap:8px;}
  .row-inline > *{flex:1;}
  .hidden{display:none !important;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(26,26,26,.12);font-size:14px;}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:420px;}

  /* ===== 모바일 반응형 ===== */
  @media (max-width: 480px){
    .wrap{padding:14px 12px 64px;}
    .navbar{padding:8px 8px 8px 16px;margin-bottom:22px;}
    .brand{font-size:13.5px;}
    .brand-dot{width:9px;height:9px;}
    .nav-admin-btn{padding:7px 12px;font-size:12px;}
    h1{font-size:23px;}
    .eyebrow{font-size:11px;margin-left:18px;}
    .sub{font-size:13px;}
    .card{padding:16px;border-radius:18px;}
    .track .tag{padding:8px 1px;font-size:10.5px;border-radius:12px;}
    .track .tag .num{font-size:16px;}
    .chip{font-size:11.5px;padding:6px 10px;}
    .rec-card{padding:14px;}
    button{font-size:14px;padding:13px 16px;}
    .row-inline{flex-direction:column;}
    .btn-row{gap:8px;}
  }
  @media (max-width: 360px){
    h1{font-size:21px;}
    .track .tag{font-size:9.5px;}
    .track .tag .num{font-size:14px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="navbar">
    <div class="brand"><span class="brand-dot"></span>기록장</div>
    <button class="nav-admin-btn" id="btnAdminOpen">관리자</button>
  </div>

  <header class="top">
    <span class="doodle doodle-1">✦</span>
    <span class="eyebrow">인체구조와 기능 · 대학연계수업</span>
    <h1>질문이 쌓이는<br>기록장</h1>
    <p class="sub" id="headerSub">학교와 이름을 선택해 입장하세요.</p>
  </header>

  <div id="msgBox"></div>

  <!-- ===================== 로그인 ===================== -->
  <section id="screen-login" class="card">
    <label for="loginSchool">학교</label>
    <select id="loginSchool"><option value="">학교 선택</option></select>

    <label for="loginName">이름</label>
    <select id="loginName" disabled><option value="">학교를 먼저 선택하세요</option></select>

    <div class="btn-row">
      <button class="btn-primary" id="btnGoInput" disabled>입력하기 →</button>
      <button class="btn-primary" id="btnGoView" disabled>조회하기 →</button>
    </div>
  </section>

  <!-- ===================== 학생 입력 ===================== -->
  <section id="screen-input" class="card hidden">
    <div class="track" id="inputTrack"></div>
    <div class="chip-row">
      <span class="chip" id="chipDate">날짜 -</span>
      <span class="chip" id="chipSystem">계통 -</span>
    </div>

    <label>수업 전 기대하는 것</label>
    <textarea id="fldExpect" placeholder="이 수업에서 무엇을 기대하나요?"></textarea>

    <label>수업 후 새롭게 배운 것</label>
    <textarea id="fldLearned" placeholder="수업이 끝난 뒤 새롭게 알게 된 것을 적어보세요."></textarea>

    <label>더 궁금해진 것</label>
    <textarea id="fldCurious" placeholder="수업을 듣고 더 궁금해진 점을 적어보세요."></textarea>

    <button class="btn-primary" id="btnSubmitRecord">저장하기 →</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px;" id="btnBackFromInput">뒤로가기</button>
  </section>

  <!-- ===================== 학생 조회 ===================== -->
  <section id="screen-view" class="card hidden">
    <div class="track" id="viewTrack"></div>
    <div id="viewList"></div>

    <div id="deepDiveBox" class="hidden">
      <hr style="border:none;border-top:1px dashed var(--line);margin:18px 0;">
      <p class="sub" style="margin-bottom:10px;">5회차를 모두 마쳤습니다. 아래에서 심화탐구 주제를 정리해보세요.</p>
      <label>① 관심 키워드 3개</label>
      <input type="text" id="ddKeywords" placeholder="예: 근육 피로, 관절염, 재활운동">
      <label>② 최종 탐구주제 후보 (1~2개)</label>
      <textarea id="ddCandidate" placeholder="탐구해보고 싶은 주제를 적어보세요."></textarea>
      <label>③ 선정 이유</label>
      <textarea id="ddReason" placeholder="왜 이 주제를 선택했나요?"></textarea>
      <button class="btn-primary" id="btnSaveDeepDive">심화탐구 저장 →</button>
    </div>

    <button class="btn-ghost" style="width:100%;margin-top:14px;" id="btnBackFromView">뒤로가기</button>
  </section>

  <!-- ===================== 관리자 로그인 ===================== -->
  <section id="screen-admin-login" class="card hidden">
    <label>관리자 비밀번호</label>
    <input type="password" id="adminPw" placeholder="비밀번호 입력">
    <button class="btn-primary" id="btnAdminLogin">확인 →</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px;" id="btnAdminCancel">취소</button>
  </section>

  <!-- ===================== 관리자 대시보드 ===================== -->
  <section id="screen-admin" class="card hidden">
    <div class="tabs">
      <button class="active" data-tab="overview">제출현황</button>
      <button data-tab="detail">학생상세</button>
      <button data-tab="master">마스터관리</button>
    </div>

    <div id="admin-overview">
      <div class="table-scroll">
      <table class="admin-table" id="overviewTable"><thead>
        <tr><th>학교</th><th>이름</th><th>제출</th><th>최종 제출일시</th></tr>
      </thead><tbody></tbody></table>
      </div>
    </div>

    <div id="admin-detail" class="hidden">
      <div class="row-inline">
        <select id="admDetailSchool"><option value="">학교</option></select>
        <select id="admDetailName"><option value="">이름</option></select>
      </div>
      <button class="btn-ghost" id="btnAdmDetailLoad" style="width:100%;margin-bottom:14px;">조회</button>
      <div id="admDetailResult"></div>
    </div>

    <div id="admin-master" class="hidden">
      <h3 style="font-size:14px;">학교 관리</h3>
      <div class="row-inline">
        <input type="text" id="admNewSchool" placeholder="새 학교명">
        <button class="btn-ghost btn-small" id="btnAdmAddSchool">추가</button>
      </div>
      <div id="admSchoolList"></div>

      <h3 style="font-size:14px;margin-top:18px;">학생 관리</h3>
      <div class="row-inline">
        <select id="admNewStudentSchool"><option value="">학교</option></select>
        <input type="text" id="admNewStudentName" placeholder="새 학생 이름">
        <button class="btn-ghost btn-small" id="btnAdmAddStudent">추가</button>
      </div>
      <div id="admStudentList"></div>

      <h3 style="font-size:14px;margin-top:18px;">회차 · 날짜 · 계통 관리</h3>
      <div id="admClassList"></div>
    </div>

    <button class="btn-ghost" style="width:100%;margin-top:16px;" id="btnAdminBack">학생 화면으로</button>
  </section>

</div>

<script>
/* ================= 설정 =================
   ↓↓↓ 배포 후 여기에 Apps Script 웹 앱 URL(.../exec)을 붙여넣으세요 ↓↓↓ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxSLdDrGsWdPSjKzX_0HwgoEx-dIFDhrJnyjCpFBisP9-0TcKw-hTNNYMkfhA0USNRO/exec';

/* ================= 상태 ================= */
let MASTER = { schools: [], students: [], classes: [] };
let CURRENT = { school: '', name: '' };
let ADMIN_PW = '';

/* ================= 공통 fetch 헬퍼 ================= */
async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}
async function apiPost(body) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}
function showMsg(text, type) {
  const box = document.getElementById('msgBox');
  box.innerHTML = `<div class="msg ${type}">${text}</div>`;
  setTimeout(() => (box.innerHTML = ''), 3500);
}
function el(id){ return document.getElementById(id); }
function showScreen(id){
  ['screen-login','screen-input','screen-view','screen-admin-login','screen-admin'].forEach(s=>{
    el(s).classList.toggle('hidden', s!==id);
  });
}

/* ================= 초기화 ================= */
async function init() {
  try {
    const data = await apiGet({ action: 'init' });
    if (!data.ok) { showMsg('마스터 데이터를 불러오지 못했습니다.', 'err'); return; }
    MASTER = data;
    fillSchoolDropdown(el('loginSchool'));
    fillSchoolDropdown(el('admNewStudentSchool'));
  } catch (err) {
    showMsg('서버 연결에 실패했습니다. API_URL 설정을 확인하세요.', 'err');
  }
}
function fillSchoolDropdown(selectEl) {
  selectEl.innerHTML = '<option value="">학교 선택</option>' +
    MASTER.schools.map(s => `<option value="${s}">${s}</option>`).join('');
}

/* ================= 로그인 화면 ================= */
el('loginSchool').addEventListener('change', () => {
  const school = el('loginSchool').value;
  const nameSel = el('loginName');
  if (!school) {
    nameSel.innerHTML = '<option value="">학교를 먼저 선택하세요</option>';
    nameSel.disabled = true;
  } else {
    const names = MASTER.students.filter(s => s['학교'] === school).map(s => s['이름']);
    nameSel.innerHTML = '<option value="">이름 선택</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
    nameSel.disabled = false;
  }
  updateLoginButtons();
});
el('loginName').addEventListener('change', updateLoginButtons);
function updateLoginButtons(){
  const ok = el('loginSchool').value && el('loginName').value;
  el('btnGoInput').disabled = !ok;
  el('btnGoView').disabled = !ok;
}

let currentHoicha = 1;
let studentRecordsCache = [];

el('btnGoInput').addEventListener('click', () => {
  CURRENT.school = el('loginSchool').value;
  CURRENT.name = el('loginName').value;
  el('headerSub').textContent = `${CURRENT.school} · ${CURRENT.name}`;
  openInputScreen(1);
});
el('btnGoView').addEventListener('click', async () => {
  CURRENT.school = el('loginSchool').value;
  CURRENT.name = el('loginName').value;
  el('headerSub').textContent = `${CURRENT.school} · ${CURRENT.name}`;
  await openViewScreen();
});

/* ================= 입력 화면 ================= */
function renderTrack(containerId, doneSet, activeHoicha, clickable) {
  const box = el(containerId);
  box.innerHTML = '';
  for (let h = 1; h <= 5; h++) {
    const tag = document.createElement('div');
    tag.className = 'tag' + (doneSet.has(h) ? ' done' : '') + (h === activeHoicha ? ' current' : '');
    tag.innerHTML = `<span class="num">${h}</span>회차`;
    if (clickable) { tag.style.cursor = 'pointer'; tag.onclick = () => clickable(h); }
    box.appendChild(tag);
  }
}

async function openInputScreen(hoicha) {
  currentHoicha = hoicha;
  showScreen('screen-input');

  const cls = MASTER.classes.find(c => String(c['회차']) === String(hoicha)) || {};
  el('chipDate').textContent = `날짜 ${cls['수업날짜'] || '-'}`;
  el('chipSystem').textContent = `계통 ${cls['계통'] || '-'}`;

  const data = await apiGet({ action: 'getStudentRecords', school: CURRENT.school, name: CURRENT.name });
  studentRecordsCache = data.ok ? data.records : [];
  const doneSet = new Set(studentRecordsCache.map(r => Number(r['회차'])));
  renderTrack('inputTrack', doneSet, hoicha, (h) => openInputScreen(h));

  const existing = studentRecordsCache.find(r => Number(r['회차']) === hoicha);
  el('fldExpect').value = existing ? existing['수업전_기대'] : '';
  el('fldLearned').value = existing ? existing['수업후_배운것'] : '';
  el('fldCurious').value = existing ? existing['수업후_궁금한것'] : '';
}

el('btnSubmitRecord').addEventListener('click', async () => {
  el('btnSubmitRecord').disabled = true;
  el('btnSubmitRecord').textContent = '저장 중...';
  const res = await apiPost({
    action: 'submitRecord',
    school: CURRENT.school, name: CURRENT.name, hoicha: currentHoicha,
    기대: el('fldExpect').value, 배운것: el('fldLearned').value, 궁금한것: el('fldCurious').value,
  });
  el('btnSubmitRecord').disabled = false;
  el('btnSubmitRecord').textContent = '저장하기 →';
  if (res.ok) { showMsg(`${currentHoicha}회차 기록이 저장되었습니다.`, 'ok'); openInputScreen(currentHoicha); }
  else showMsg(res.error || '저장에 실패했습니다.', 'err');
});
el('btnBackFromInput').addEventListener('click', () => showScreen('screen-login'));

/* ================= 조회 화면 ================= */
async function openViewScreen() {
  showScreen('screen-view');
  const data = await apiGet({ action: 'getStudentRecords', school: CURRENT.school, name: CURRENT.name });
  const records = data.ok ? data.records : [];
  const doneSet = new Set(records.map(r => Number(r['회차'])));
  renderTrack('viewTrack', doneSet, 0, null);

  const list = el('viewList');
  list.innerHTML = '';
  for (let h = 1; h <= 5; h++) {
    const r = records.find(x => Number(x['회차']) === h);
    const div = document.createElement('div');
    div.className = 'rec-card';
    if (!r) {
      div.innerHTML = `<div class="head"><span class="badge empty-badge">${h}회차 · 미제출</span></div>`;
    } else {
      div.innerHTML = `
        <div class="head">
          <span class="badge">${h}회차 · ${r['계통']}</span>
          <span class="meta">${r['최종제출일시']}</span>
        </div>
        <div class="field-label">수업 전 기대하는 것</div><div class="field-val">${r['수업전_기대']||'-'}</div>
        <div class="field-label">수업 후 새롭게 배운 것</div><div class="field-val">${r['수업후_배운것']||'-'}</div>
        <div class="field-label">더 궁금해진 것</div><div class="field-val">${r['수업후_궁금한것']||'-'}</div>
      `;
    }
    list.appendChild(div);
  }

  if (doneSet.size === 5) {
    el('deepDiveBox').classList.remove('hidden');
    if (data.deepdive) {
      el('ddKeywords').value = data.deepdive['관심키워드3개'] || '';
      el('ddCandidate').value = data.deepdive['탐구후보'] || '';
      el('ddReason').value = data.deepdive['선정이유'] || '';
    }
  } else {
    el('deepDiveBox').classList.add('hidden');
  }
}
el('btnSaveDeepDive').addEventListener('click', async () => {
  const res = await apiPost({
    action: 'submitDeepDive', school: CURRENT.school, name: CURRENT.name,
    키워드: el('ddKeywords').value, 후보: el('ddCandidate').value, 이유: el('ddReason').value,
  });
  if (res.ok) showMsg('심화탐구 내용이 저장되었습니다.', 'ok');
  else showMsg(res.error || '저장에 실패했습니다.', 'err');
});
el('btnBackFromView').addEventListener('click', () => showScreen('screen-login'));

/* ================= 관리자 ================= */
el('btnAdminOpen').addEventListener('click', () => showScreen('screen-admin-login'));
el('btnAdminCancel').addEventListener('click', () => showScreen('screen-login'));
el('btnAdminLogin').addEventListener('click', async () => {
  const pw = el('adminPw').value;
  const res = await apiGet({ action: 'adminCheck', pw });
  if (res.ok) { ADMIN_PW = pw; el('adminPw').value=''; openAdminDashboard(); }
  else showMsg('비밀번호가 올바르지 않습니다.', 'err');
});
el('btnAdminBack').addEventListener('click', () => showScreen('screen-login'));

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['overview','detail','master'].forEach(t => el(`admin-${t}`).classList.toggle('hidden', t !== btn.dataset.tab));
  });
});

async function openAdminDashboard() {
  showScreen('screen-admin');
  await loadOverview();
  fillSchoolDropdown(el('admDetailSchool'));
  renderMasterLists();
}

async function loadOverview() {
  const res = await apiGet({ action: 'adminOverview', pw: ADMIN_PW });
  const tbody = document.querySelector('#overviewTable tbody');
  tbody.innerHTML = '';
  if (!res.ok) { showMsg(res.error, 'err'); return; }
  res.overview.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row['학교']}</td><td>${row['이름']}</td><td>${row['제출회차수']}/5</td><td>${row['최종제출일시']||'-'}</td>`;
    tbody.appendChild(tr);
  });
}

el('admDetailSchool').addEventListener('change', () => {
  const school = el('admDetailSchool').value;
  const sel = el('admDetailName');
  const names = MASTER.students.filter(s => s['학교']===school).map(s=>s['이름']);
  sel.innerHTML = '<option value="">이름</option>' + names.map(n=>`<option value="${n}">${n}</option>`).join('');
});
el('btnAdmDetailLoad').addEventListener('click', async () => {
  const school = el('admDetailSchool').value, name = el('admDetailName').value;
  if (!school || !name) return;
  const res = await apiGet({ action:'adminStudentDetail', pw:ADMIN_PW, school, name });
  const box = el('admDetailResult');
  box.innerHTML = '';
  if (!res.ok) { showMsg(res.error,'err'); return; }
  for (let h=1; h<=5; h++){
    const r = res.records.find(x=>Number(x['회차'])===h);
    const div = document.createElement('div');
    div.className='rec-card';
    if(!r){ div.innerHTML = `<div class="head"><span class="badge empty-badge">${h}회차 · 미제출</span></div>`; }
    else {
      div.innerHTML = `
        <div class="head"><span class="badge">${h}회차 · ${r['계통']}</span><span class="meta">${r['최종제출일시']}</span></div>
        <div class="field-label">수업 전 기대</div><div class="field-val">${r['수업전_기대']||'-'}</div>
        <div class="field-label">배운 것</div><div class="field-val">${r['수업후_배운것']||'-'}</div>
        <div class="field-label">궁금한 것</div><div class="field-val">${r['수업후_궁금한것']||'-'}</div>`;
    }
    box.appendChild(div);
  }
  if (res.deepdive){
    const div = document.createElement('div');
    div.className='rec-card';
    div.innerHTML = `
      <div class="head"><span class="badge">심화탐구</span></div>
      <div class="field-label">관심 키워드</div><div class="field-val">${res.deepdive['관심키워드3개']||'-'}</div>
      <div class="field-label">탐구 후보</div><div class="field-val">${res.deepdive['탐구후보']||'-'}</div>
      <div class="field-label">선정 이유</div><div class="field-val">${res.deepdive['선정이유']||'-'}</div>`;
    box.appendChild(div);
  }
});

function renderMasterLists(){
  el('admSchoolList').innerHTML = MASTER.schools.map(s=>`
    <div class="list-item"><span>${s}</span>
      <button class="btn-ghost btn-small btn-danger" onclick="deleteSchool('${s}')">삭제</button>
    </div>`).join('');

  el('admStudentList').innerHTML = MASTER.students.map(s=>`
    <div class="list-item"><span>${s['학교']} · ${s['이름']}</span>
      <button class="btn-ghost btn-small btn-danger" onclick="deleteStudent('${s['학교']}','${s['이름']}')">삭제</button>
    </div>`).join('');

  el('admClassList').innerHTML = MASTER.classes.map(c => `
    <div class="card" style="padding:12px;margin-bottom:8px;">
      <div class="row-inline">
        <div><label style="margin-bottom:4px;">${c['회차']}회차 날짜</label>
          <input type="text" id="cls-date-${c['회차']}" value="${c['수업날짜']}"></div>
        <div><label style="margin-bottom:4px;">계통</label>
          <input type="text" id="cls-sys-${c['회차']}" value="${c['계통']}"></div>
      </div>
      <button class="btn-ghost btn-small" onclick="saveClass(${c['회차']})">저장</button>
    </div>`).join('');
}

async function deleteSchool(school){
  if(!confirm(`'${school}'를 삭제할까요?`)) return;
  const res = await apiPost({action:'adminDeleteSchool', pw:ADMIN_PW, school});
  if(res.ok){ await init(); renderMasterLists(); showMsg('삭제되었습니다.','ok'); } else showMsg(res.error,'err');
}
async function deleteStudent(school,name){
  if(!confirm(`'${school} ${name}'을 삭제할까요?`)) return;
  const res = await apiPost({action:'adminDeleteStudent', pw:ADMIN_PW, school, name});
  if(res.ok){ await init(); renderMasterLists(); showMsg('삭제되었습니다.','ok'); } else showMsg(res.error,'err');
}
async function saveClass(hoicha){
  const 날짜 = el(`cls-date-${hoicha}`).value;
  const 계통 = el(`cls-sys-${hoicha}`).value;
  const res = await apiPost({action:'adminSaveClass', pw:ADMIN_PW, hoicha, 날짜, 계통});
  if(res.ok){ await init(); showMsg(`${hoicha}회차 정보가 저장되었습니다.`,'ok'); } else showMsg(res.error,'err');
}
el('btnAdmAddSchool').addEventListener('click', async () => {
  const school = el('admNewSchool').value.trim();
  if(!school) return;
  const res = await apiPost({action:'adminAddSchool', pw:ADMIN_PW, school});
  if(res.ok){ el('admNewSchool').value=''; await init(); renderMasterLists(); showMsg('학교가 추가되었습니다.','ok'); } else showMsg(res.error,'err');
});
el('btnAdmAddStudent').addEventListener('click', async () => {
  const school = el('admNewStudentSchool').value;
  const name = el('admNewStudentName').value.trim();
  if(!school || !name) return;
  const res = await apiPost({action:'adminAddStudent', pw:ADMIN_PW, school, name});
  if(res.ok){ el('admNewStudentName').value=''; await init(); renderMasterLists(); showMsg('학생이 추가되었습니다.','ok'); } else showMsg(res.error,'err');
});

init();
</script>
</body>
</html>
